<!-- Boas-vindas. Referência: design/telas-v2/V2-boas-vindas*.dc.html; contrato frontend-services §4. -->
<div class="flex min-h-dvh flex-col bg-background text-text xl:flex-row">
  <div class="relative h-[470px] shrink-0 overflow-hidden bg-photo md:h-[560px] xl:h-auto xl:w-1/2">
    @if (!photoFailed()) {
      <img
        [src]="photoSrc"
        width="1440"
        height="1800"
        alt="Paçoca, um vira-lata caramelo de orelhas caídas, sorrindo para a câmera"
        i18n-alt
        class="absolute inset-0 size-full object-cover object-[center_30%] transition-opacity duration-300 md:object-[center_32%]"
        [class.opacity-0]="!photoLoaded()"
        (load)="photoLoaded.set(true)"
        (error)="photoFailed.set(true)"
        data-testid="welcome-photo" />
    }
    <div class="absolute top-4 left-4 md:hidden xl:hidden"><app-brand-mark [size]="44" /></div>
    <div class="absolute top-6 left-6 hidden md:block xl:hidden"><app-brand-mark [size]="52" /></div>
  </div>

  <main
    class="relative -mt-7 flex flex-1 flex-col rounded-t-[28px] bg-background px-5 pt-[26px] pb-[22px] md:-mt-8 md:items-center md:rounded-t-[32px] md:px-0 md:pt-11 md:pb-10 xl:mt-0 xl:justify-center xl:rounded-none xl:px-[120px] xl:py-12"
    aria-labelledby="welcome-heading">
    <div class="flex flex-1 flex-col md:w-[560px] md:flex-1 xl:w-full xl:flex-none">
      <div class="mb-9 hidden xl:block"><app-logo tone="on-light" [height]="64" /></div>

      @if (accountDeleted()) {
        <z-alert
          class="mb-4"
          zType="neutral"
          zDescription="Sua conta foi excluída."
          i18n-zDescription
          data-testid="welcome-deleted-notice" />
      }

      <h1
        id="welcome-heading"
        class="font-display text-[38px] leading-[1.04] font-bold tracking-[-0.03em] text-foreground md:text-[56px] xl:text-[64px]"
        i18n>
        O caminho de volta para casa.
      </h1>
      <p class="mt-3 text-base leading-[1.45] text-text md:text-lg" i18n>
        Uma tag com QR na coleira. Quem encontrar o seu pet fala com você na hora, sem precisar de app.
      </p>

      <div class="min-h-4 flex-1 md:min-h-6 xl:min-h-10 xl:flex-none"></div>

      <a
        z-button
        zSize="lg"
        class="w-full"
        routerLink="/auth/criar-conta"
        [queryParams]="queryParams()"
        data-testid="welcome-create-account"
        i18n>
        Criar conta
      </a>
      <a
        z-button
        zType="outline"
        zSize="lg"
        class="mt-2.5 w-full"
        routerLink="/auth/login"
        [queryParams]="queryParams()"
        data-testid="welcome-login"
        i18n>
        Já tenho conta
      </a>
    </div>
  </main>
</div>

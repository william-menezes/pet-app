<!-- pets.html — tela provisória do app do tutor (a casca vem de TutorApp).
     Contém o botão de logout (T042, FR-010) com data-testid="login-logout".
     O painel de verdade vem na feature de pets. -->
<section class="flex flex-col items-start gap-3" data-testid="pets-home">
  <h1 class="font-display text-[32px] leading-tight font-bold tracking-[-0.03em] text-foreground" i18n>Meus pets</h1>
  <p class="text-base text-text" i18n>Painel autenticado (CSR). Provisório: implementado na feature de pets.</p>
  <button
    type="button"
    z-button
    zType="outline"
    zSize="sm"
    (click)="signOut()"
    aria-label="Sair da conta"
    i18n-aria-label
    data-testid="login-logout"
    i18n>
    Sair
  </button>
</section>

<div class="sticky top-0 hidden h-dvh w-[560px] shrink-0 xl:flex">
  <app-brand-panel class="flex-1" variant="flow" [headline]="headline()" [sub]="sub()" data-testid="flow-shell-brand-panel" />
</div>

<div class="flex min-w-0 flex-1 flex-col">
  <div class="flex min-h-12 items-center gap-3 px-4 pt-3 md:justify-between md:px-7 md:pt-6 xl:min-h-11 xl:justify-end xl:px-8">
    <app-logo class="hidden md:block xl:hidden" [height]="52" />

    @if (back(); as kind) {
      @if (backLink(); as link) {
        <a
          z-button
          zType="ghost"
          zSize="icon"
          class="bg-card"
          [routerLink]="link"
          [attr.aria-label]="label(kind)"
          data-testid="flow-shell-back"
        >
          <ng-icon [name]="kind === 'close' ? 'close' : 'back'" size="22" aria-hidden="true" />
        </a>
      } @else {
        <button
          type="button"
          z-button
          zType="ghost"
          zSize="icon"
          class="bg-card"
          [attr.aria-label]="label(kind)"
          data-testid="flow-shell-back"
          (click)="backClick.emit()"
        >
          <ng-icon [name]="kind === 'close' ? 'close' : 'back'" size="22" aria-hidden="true" />
        </button>
      }
    }
    @if (barTitle()) {
      <p class="min-w-0 flex-1 font-display text-[19px] font-semibold text-foreground md:hidden" data-testid="flow-shell-bar-title">
        {{ barTitle() }}
      </p>
    }
  </div>

  <div class="mx-auto flex w-full flex-1 flex-col md:w-[480px] md:justify-center md:pb-14 xl:w-[440px]">
    @if (barTitle()) {
      <p class="hidden px-0 font-display text-base font-semibold text-muted-foreground md:mb-2 md:block" data-testid="flow-shell-column-title">
        {{ barTitle() }}
      </p>
    }
    <main class="flex flex-1 flex-col md:flex-none">
      <div class="flex flex-1 flex-col gap-4 px-5 pt-3 pb-4 md:flex-none md:gap-[18px] md:p-0">
        @if (step(); as s) {
          <app-steps [current]="s.current" [total]="s.total" />
        }
        <ng-content />
      </div>
      <div
        class="flex flex-col items-center gap-2.5 px-5 pb-5 md:mt-2.5 md:px-0 md:pb-0"
        data-testid="flow-shell-footer"
      >
        <ng-content select="[footer]" />
      </div>
    </main>
  </div>
</div>

<div class="flex min-h-dvh flex-col bg-background text-text xl:flex-row">
  <a
    href="#conteudo"
    class="sr-only z-50 rounded-full bg-card px-4 py-2 font-semibold text-foreground focus:not-sr-only focus:absolute focus:top-3 focus:left-3"
    data-testid="admin-shell-skip"
    (click)="skipToContent($event, main)"
    i18n
  >
    Pular para o conteúdo
  </a>

  <!-- Celular e tablet: barra no topo -->
  <header
    class="flex flex-col gap-2.5 bg-card px-4 pt-3 pb-2.5 md:px-7 md:pt-4 md:pb-3 xl:hidden"
    data-testid="admin-shell-topbar"
  >
    <div class="flex items-center gap-2.5">
      <app-logo class="md:hidden" [height]="40" />
      <app-logo class="hidden md:block" [height]="44" />
      <z-badge zType="ink" i18n>Admin</z-badge>
    </div>
    <nav class="-my-1 flex gap-1.5 overflow-x-auto py-1" aria-label="Navegação do admin" i18n-aria-label>
      @for (item of items(); track item.id) {
        <a
          #rla="routerLinkActive"
          [routerLink]="item.link"
          routerLinkActive
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          [class]="tabItem + ' ' + (rla.isActive ? active : inactive)"
          [attr.data-testid]="'admin-nav-' + item.id"
        >
          <ng-icon [name]="item.icon" size="18" aria-hidden="true" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </header>

  <!-- Desktop: menu lateral -->
  <aside
    class="sticky top-0 hidden h-dvh w-[264px] shrink-0 flex-col gap-1.5 bg-card px-5 py-6 xl:flex"
    data-testid="admin-shell-sidebar"
  >
    <div class="mb-[22px] flex items-center gap-2.5">
      <app-logo [height]="48" />
      <z-badge zType="ink" i18n>Admin</z-badge>
    </div>
    <nav class="flex flex-col gap-1.5" aria-label="Navegação do admin" i18n-aria-label>
      @for (item of items(); track item.id) {
        <a
          #rla="routerLinkActive"
          [routerLink]="item.link"
          routerLinkActive
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          [class]="sideItem + ' ' + (rla.isActive ? active : inactive)"
          [attr.data-testid]="'admin-nav-' + item.id"
        >
          <ng-icon [name]="item.icon" size="20" aria-hidden="true" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <main
    #main
    id="conteudo"
    tabindex="-1"
    class="flex min-w-0 flex-1 flex-col gap-3.5 px-4 pt-[18px] pb-5 outline-none md:gap-[18px] md:px-7 md:py-6 xl:gap-5 xl:px-12 xl:py-8"
    data-testid="admin-shell-main"
  >
    <ng-content />
  </main>
</div>

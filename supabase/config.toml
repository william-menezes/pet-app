# Supabase local development configuration — Faro
# Secrets (GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_SECRET, HASH_SALT, service_role)
# live in .env.local (NOT committed). See supabase/.env.local.example.

[api]
enabled = true
port = 54321
# Spec 004 (0017): so `public`. Nada no Faro usa GraphQL (pg_graphql removida). max_rows continua em 1000: o limite vale
# tambem para service_role e cortaria em silencio a geracao de etiquetas e a exportacao de um lote (ate 540 codigos).
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Coletor de e-mails local (CLI >= 3.x: `local_smtp`, antes `inbucket`).
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:4200"
additional_redirect_urls = ["http://localhost:4200/auth/callback"]
jwt_expiry = 3600
enable_signup = true
# Spec 004, security-hardening.contract.md secao 4: rotacao de refresh token, sem entrada anonima, sem vinculo manual.
# Sem tempo maximo de sessao nem saida por inatividade (decisao do contrato: o tutor volta no dia em que o pet some).
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_anonymous_sign_ins = false
enable_manual_linking = false
# FR-003, imposto no servidor (contracts/auth-config.contract.md). Sem regra de composicao.
minimum_password_length = 8
password_requirements = ""

# Rate-limit nativo do GoTrue — camada ampla (FR-018, defesa em duas camadas).
# A segunda camada é a tabela auth_login_attempts + Edge login-guard.
# Nomes válidos na CLI 3.x: email_sent (e-mails por hora), token_refresh (por 5 min, por IP).
[auth.rate_limit]
# Os valores abaixo são defaults conservadores para dev/staging.
email_sent = 30           # e-mails por hora (global). Producao: ajustar ao plano do provedor SMTP
sign_in_sign_ups = 30     # por 5 min, por IP
token_verifications = 30  # por 5 min, por IP (confirmacao e recuperacao)
token_refresh = 150       # por 5 min, por IP

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true   # FR-024 da 001; tambem ativa a resposta ofuscada para e-mail ja cadastrado
secure_password_change = true  # trava de servidor para troca de senha em sessao antiga
max_frequency = "60s"          # intervalo minimo entre e-mails para o mesmo usuario (FR-011)
otp_expiry = 3600              # validade dos links: 1 hora (FR-012, FR-035)

[auth.email.template.confirmation]
subject = "Confirme seu e-mail no Faro"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Crie uma nova senha no Faro"
content_path = "./supabase/templates/recovery.html"

# O celular NAO e forma de entrar (FR-028) e o SMS desta spec nao passa pelo Auth.
[auth.sms]
enable_signup = false
enable_confirmations = false

# Spec 004, security-hardening.contract.md secao 1: desafio anti-robo (Cloudflare Turnstile).
# `enabled = false` ate a T104: ligar antes quebraria todo login/cadastro, porque as telas ainda nao enviam o token.
# O segredo vem do ambiente (SUPABASE_AUTH_CAPTCHA_SECRET), nunca do arquivo. Desenvolvimento e E2E usam as chaves de
# TESTE da Cloudflare (publicas, documentacao "Testing"): segredo 1x0000000000000000000000000000000AA (sempre aprova),
# 2x0000000000000000000000000000000AA (sempre reprova); site key 1x00000000000000000000AA (aprova) e 2x00000000000000000000AB (reprova).
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

# Google OAuth (FR-016/Princípio III): client id/secret NUNCA commitados.
# Configure via `supabase secrets set GOOGLE_OAUTH_CLIENT_ID=... GOOGLE_OAUTH_SECRET=...`
# ou no painel do Supabase em Authentication → Providers → Google.
[auth.external.google]
enabled = false           # dev: false; staging/prod: true + envs abaixo
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[analytics]
enabled = false

# Edge Functions: verify_jwt é configurado por função (a chave global não existe mais).
[functions.login-guard]
verify_jwt = true

# Spec 004: confirmacao de celular. Exigem usuario autenticado (a propria funcao valida o JWT com getUser).
[functions.phone-verify-start]
verify_jwt = true

[functions.phone-verify-confirm]
verify_jwt = true

# Spec 004: recuperacao de senha. Aceita a chave anonima (qualquer visitante); a funcao nao exige usuario.
[functions.password-recovery]
verify_jwt = true

# Spec 004: exclusao da propria conta. Exige usuario autenticado (a funcao valida o JWT com getUser).
[functions.account-delete]
verify_jwt = true

# Spec 003: chamadas de servidor para servidor. O servidor SSR do app (Vercel) NAO tem chave do Supabase (la ficam so a
# FARO_SSR_KEY e o IP_HASH_SECRET), entao o gateway nao pode exigir JWT: a autorizacao e o cabecalho `x-faro-ssr-key`, comparado
# em tempo constante dentro da funcao (_shared/auth.ts), e a funcao responde 401 de corpo vazio sem ele. register-scan valida
# o JWT do tutor (campo `user_jwt` do corpo) por conta propria, so para saber se quem abriu a pagina e o dono.
# O contrato nao diz qual valor de verify_jwt usar nestas duas (decisao registrada em execution-log.md).
[functions.resolve-tag]
verify_jwt = false

[functions.register-scan]
verify_jwt = false
